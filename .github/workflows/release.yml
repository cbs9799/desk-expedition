name: Release

# v로 시작하는 태그를 푸시하면 빌드해서 GitHub Releases에 zip/dmg를 올린다.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 최신 Xcode 선택
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 테스트
        run: |
          xcodegen generate
          xcodebuild -project DeskExpedition.xcodeproj -scheme DeskExpedition \
            -derivedDataPath build/test test | tail -5

      - name: 패키징
        run: scripts/package.sh "${GITHUB_REF_NAME}"

      - name: 릴리스에 업로드
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "책상 원정대 $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md

      - name: 아티팩트 보관 (수동 실행용)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: DeskExpedition
          path: dist/*
