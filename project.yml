name: DeskExpedition
options:
  developmentLanguage: ko
  bundleIdPrefix: club.lemongrove
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.11"
    CURRENT_PROJECT_VERSION: "13"
targets:
  DeskExpedition:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/Art
        buildPhase: resources
      - path: Resources/AI
        buildPhase: resources
      - path: Resources/Loc
        buildPhase: resources
      - path: Resources/Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 책상 원정대
        CFBundleName: 책상 원정대
        LSUIElement: true
        CFBundleLocalizations: [ko, en]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.role-playing-games
        NSHumanReadableCopyright: "© 2026 Lemongrove"
    entitlements:
      path: Sources/DeskExpedition.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.lemongrove.deskexpedition
        PRODUCT_NAME: DeskExpedition
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          # Separate sandbox container so dev builds never collide with the signed release app.
          PRODUCT_BUNDLE_IDENTIFIER: club.lemongrove.deskexpedition.debug
  DeskExpeditionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Config/Products.storekit
        buildPhase: resources
    dependencies:
      - target: DeskExpedition
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.lemongrove.deskexpedition.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DeskExpedition.app/Contents/MacOS/DeskExpedition"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DeskExpedition:
    build:
      targets:
        DeskExpedition: all
        DeskExpeditionTests: [test]
    run:
      storeKitConfiguration: Config/Products.storekit
    test:
      targets:
        - DeskExpeditionTests
